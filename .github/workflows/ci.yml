name: SecuraVault CI

on:
  push:
    branches:
      - main
      - feature/continuous-delivery

  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: securavault

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install cryptography pytest pytest-cov pylint build setuptools wheel

      - name: Run automated tests
        run: python -m pytest -v

      - name: Run Pylint
        run: python -m pylint src --exit-zero

      - name: Build package
        run: python -m build